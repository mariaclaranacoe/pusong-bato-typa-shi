<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Heart ❤️</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           PAGE
        ========================= */

        body {

            min-height: 100vh;

            background: #0d0d18;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            cursor: pointer;
        }


        /* =========================
           HEART CONTAINER
        ========================= */

        .heart-container {

            /*
                Responsive size.

                Desktop:
                maximum 500px

                Phone:
                90% of screen width
            */
            width: min(500px, 90vw);

            /*
                Always keep it square.
            */
            aspect-ratio: 1 / 1;

            position: relative;
        }


        /* =========================
           VIDEO
        ========================= */

        #heart-video {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            /*
                Keep the video filling
                the square container.
            */
            object-fit: cover;

            /*
                The SAME heart shape is
                used to clip the video.
            */
            clip-path: url(#heartClip);

            /*
                Invisible initially.
            */
            opacity: 0;

            transition: opacity 2s ease;

            pointer-events: none;

            z-index: 1;
        }


        #heart-video.show {

            opacity: 1;
        }


        /* =========================
           HEART SVG
        ========================= */

        #heart-svg {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: visible;

            z-index: 2;

            pointer-events: none;
        }


        /* =========================
           HEART OUTLINE
        ========================= */

        #heart {

            fill: none;

            stroke: #ff4f81;

            stroke-width: 5;

            stroke-linecap: round;

            stroke-linejoin: round;

            /*
                Hidden before clicking.
            */
            stroke-dasharray: 1000;

            stroke-dashoffset: 1000;

            visibility: hidden;

            filter:
                drop-shadow(0 0 5px #ff4f81)
                drop-shadow(0 0 15px #ff4f81);
        }


        /*
            Show the heart after
            the user clicks.
        */
        #heart.start {

            visibility: visible;
        }


        /* =========================
           MOVING DOT
        ========================= */

        #dot {

            display: none;
        }


        /* =========================
           START MESSAGE
        ========================= */

        #start-message {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 20px;

            font-weight: 500;

            letter-spacing: 1px;

            text-align: center;

            opacity: 0.85;

            pointer-events: none;

            transition: opacity 0.5s ease;

            z-index: 10;

            /*
                Prevent text from wrapping
                strangely on small screens.
            */
            white-space: nowrap;
        }


        #start-message.hide {

            opacity: 0;
        }


    </style>

</head>


<body>


    <!-- =========================
         START MESSAGE
    ========================= -->

    <div id="start-message">
        Click anywhere ❤️
    </div>



    <!-- =========================
         HEART CONTAINER
    ========================= -->

    <div class="heart-container">


        <!-- =========================
             VIDEO
        ========================= -->

        <video
            id="heart-video"
            src="video.mp4"
            loop
            playsinline
            preload="auto"
        ></video>



        <!-- =========================
             HEART SVG
        ========================= -->

        <svg
            id="heart-svg"
            viewBox="0 0 500 500"
            preserveAspectRatio="xMidYMid meet"
        >


            <!--
                =========================
                VIDEO CLIPPING
                =========================

                IMPORTANT:

                The coordinates here are
                normalized from 0 to 1.

                This allows the heart shape
                to scale with the video on
                BOTH desktop and mobile.
            -->

            <defs>

                <clipPath
                    id="heartClip"
                    clipPathUnits="objectBoundingBox"
                >

                    <path
                        d="
                            M 0.5 0.3

                            C 0.36 0.14,
                              0.12 0.20,
                              0.12 0.42

                            C 0.12 0.60,
                              0.30 0.70,
                              0.50 0.88

                            C 0.70 0.70,
                              0.88 0.60,
                              0.88 0.42

                            C 0.88 0.20,
                              0.64 0.14,
                              0.50 0.30

                            Z
                        "
                    />

                </clipPath>

            </defs>



            <!-- =========================
                 HEART OUTLINE
            ========================= -->

            <path
                id="heart"
                d="
                    M 250 150

                    C 180 70,
                      60 100,
                      60 210

                    C 60 300,
                      150 350,
                      250 440

                    C 350 350,
                      440 300,
                      440 210

                    C 440 100,
                      320 70,
                      250 150
                "
            />



            <!--
                Hidden dot.
            -->

            <circle
                id="dot"
                r="8"
                cx="250"
                cy="150"
            />


        </svg>

    </div>



    <script>


        // =========================
        // GET ELEMENTS
        // =========================

        const heart =
            document.getElementById("heart");

        const dot =
            document.getElementById("dot");

        const video =
            document.getElementById("heart-video");

        const startMessage =
            document.getElementById("start-message");



        // =========================
        // HEART PATH LENGTH
        // =========================

        const pathLength =
            heart.getTotalLength();



        // =========================
        // ANIMATION SETTINGS
        // =========================

        const duration = 4000;

        let startTime = null;



        // =========================
        // HEART ANIMATION
        // =========================

        function animate(timestamp) {


            if (!startTime) {

                startTime = timestamp;

            }


            // Calculate progress

            let progress =
                (timestamp - startTime) / duration;


            if (progress > 1) {

                progress = 1;

            }



            // =========================
            // DRAW HEART
            // =========================

            heart.style.strokeDasharray =
                pathLength;

            heart.style.strokeDashoffset =
                pathLength * (1 - progress);



            // =========================
            // DOT POSITION
            // =========================

            const point =
                heart.getPointAtLength(
                    pathLength * progress
                );


            dot.setAttribute(
                "cx",
                point.x
            );


            dot.setAttribute(
                "cy",
                point.y
            );



            // =========================
            // CONTINUE
            // =========================

            if (progress < 1) {

                requestAnimationFrame(animate);

            }
            else {

                heartFinished();

            }

        }



        // =========================
        // HEART FINISHED
        // =========================

        function heartFinished() {


            setTimeout(() => {


                /*
                    Restart video.
                */

                video.currentTime = 0;


                /*
                    Turn sound on.
                */

                video.volume = 1;


                /*
                    Fade video in.
                */

                video.classList.add("show");


            }, 500);

        }



        // =========================
        // FIRST CLICK
        // =========================

        document.body.addEventListener(
            "click",
            () => {


                /*
                    Hide message.
                */

                startMessage.classList.add("hide");



                /*
                    Show heart.
                */

                heart.classList.add("start");



                /*
                    Start video silently
                    because the browser needs
                    a user interaction before
                    allowing media playback.
                */

                video.volume = 0;

                video.currentTime = 0;

                video.play();



                /*
                    Start heart animation.
                */

                requestAnimationFrame(animate);


            },
            {
                once: true
            }
        );


    </script>

</body>
</html>
