<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>pusong bato ❤️</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           PAGE
        ========================= */

        body {

            min-height: 100vh;

            background: #0d0d18;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            cursor: pointer;
        }


        /* =========================
           HEART CONTAINER
        ========================= */

        .heart-container {

            width: 500px;
            height: 500px;

            position: relative;
        }


        /* =========================
           VIDEO
        ========================= */

        #heart-video {

            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            /*
                Use the SVG clip path.

                This makes the video actually
                take the shape of the heart.
            */
            clip-path: url(#heartClip);

            /*
                Completely invisible at first.
            */
            opacity: 0;

            /*
                Fade in.
            */
            transition: opacity 2s ease;

            pointer-events: none;

            z-index: 1;
        }


        /*
            Video becomes visible after
            the heart is finished.
        */
        #heart-video.show {

            opacity: 1;
        }


        /* =========================
           HEART SVG
        ========================= */

        svg {

            position: absolute;

            width: 100%;
            height: 100%;

            overflow: visible;

            z-index: 2;

            pointer-events: none;
        }


        /* =========================
           HEART OUTLINE
        ========================= */

        #heart {

            fill: none;

            stroke: #ff4f81;

            stroke-width: 5;

            stroke-linecap: round;
            stroke-linejoin: round;

            /*
                Hidden initially.
            */
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;

            visibility: hidden;

            /*
                Glow.
            */
            filter:
                drop-shadow(0 0 5px #ff4f81)
                drop-shadow(0 0 15px #ff4f81);
        }


        /*
            When animation starts,
            make the heart visible.
        */
        #heart.start {

            visibility: visible;
        }


        /* =========================
           MOVING DOT
        ========================= */

        #dot {

            display: none;
        }


        /* =========================
           CLICK MESSAGE
        ========================= */

        #start-message {

            position: fixed;

            /*
                Exact center.
            */
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 20px;

            font-weight: 500;

            letter-spacing: 1px;

            opacity: 0.85;

            pointer-events: none;

            transition: opacity 0.5s ease;

            z-index: 10;
        }


        /*
            Hide the message after clicking.
        */
        #start-message.hide {

            opacity: 0;
        }


        /* =========================
           INVISIBLE SVG USED FOR
           THE VIDEO CLIPPING
        ========================= */

        #clip-svg {

            position: absolute;

            width: 0;
            height: 0;

            overflow: hidden;
        }

    </style>

</head>


<body>


    <!--
        =========================
        CLICK MESSAGE
        =========================

        This is centered on the screen.
    -->

    <div id="start-message">
        Click anywhere ❤️
    </div>



    <!--
        =========================
        VIDEO CLIP PATH
        =========================

        This SVG defines the actual
        heart shape used to cut the video.
    -->

    <svg id="clip-svg">

        <defs>

            <clipPath
                id="heartClip"
                clipPathUnits="userSpaceOnUse"
            >

                <path
                    d="
                        M 250 150
                        C 180 70, 60 100, 60 210
                        C 60 300, 150 350, 250 440
                        C 350 350, 440 300, 440 210
                        C 440 100, 320 70, 250 150
                        Z
                    "
                />

            </clipPath>

        </defs>

    </svg>



    <!--
        =========================
        HEART CONTAINER
        =========================
    -->

    <div class="heart-container">


        <!--
            VIDEO

            Put video.mp4 in the same
            folder as index.html.
        -->

        <video
            id="heart-video"
            src="video.mp4"
            loop
            playsinline
            preload="auto"
        ></video>



        <!--
            =========================
            HEART OUTLINE
            =========================
        -->

        <svg viewBox="0 0 500 500">


            <path
                id="heart"
                d="
                    M 250 150
                    C 180 70, 60 100, 60 210
                    C 60 300, 150 350, 250 440
                    C 350 350, 440 300, 440 210
                    C 440 100, 320 70, 250 150
                "
            />


            <!--
                Dot is hidden using CSS.
            -->

            <circle
                id="dot"
                r="8"
                cx="250"
                cy="150"
            />

        </svg>

    </div>



    <script>


        // =========================
        // GET ELEMENTS
        // =========================

        const heart =
            document.getElementById("heart");

        const dot =
            document.getElementById("dot");

        const video =
            document.getElementById("heart-video");

        const startMessage =
            document.getElementById("start-message");



        // =========================
        // GET HEART PATH LENGTH
        // =========================

        const pathLength =
            heart.getTotalLength();



        // =========================
        // ANIMATION SETTINGS
        // =========================

        const duration = 4000;

        let startTime = null;



        // =========================
        // HEART ANIMATION
        // =========================

        function animate(timestamp) {


            if (!startTime) {

                startTime = timestamp;

            }


            // Calculate progress

            let progress =
                (timestamp - startTime) / duration;


            if (progress > 1) {

                progress = 1;

            }



            // =========================
            // DRAW THE HEART
            // =========================

            heart.style.strokeDasharray =
                pathLength;

            heart.style.strokeDashoffset =
                pathLength * (1 - progress);



            // =========================
            // DOT POSITION
            // =========================

            const point =
                heart.getPointAtLength(
                    pathLength * progress
                );


            dot.setAttribute(
                "cx",
                point.x
            );


            dot.setAttribute(
                "cy",
                point.y
            );



            // =========================
            // CONTINUE
            // =========================

            if (progress < 1) {

                requestAnimationFrame(animate);

            }
            else {

                heartFinished();

            }

        }



        // =========================
        // WHEN HEART IS FINISHED
        // =========================

        function heartFinished() {


            /*
                Wait half a second
                before showing the video.
            */

            setTimeout(() => {


                /*
                    Restart video from
                    the beginning.
                */

                video.currentTime = 0;


                /*
                    Turn sound on.
                */

                video.volume = 1;


                /*
                    Fade the video in.
                */

                video.classList.add("show");


            }, 500);

        }



        // =========================
        // FIRST CLICK
        // =========================

        document.body.addEventListener(
            "click",
            () => {


                /*
                    Hide "Click anywhere ❤️"
                */

                startMessage.classList.add("hide");



                /*
                    Make the heart visible.
                */

                heart.classList.add("start");



                /*
                    Start the video silently.

                    This allows the browser to
                    recognize the video as being
                    started by the user's click.
                */

                video.volume = 0;

                video.currentTime = 0;

                video.play();



                /*
                    Start drawing the heart.
                */

                requestAnimationFrame(animate);


            },
            {
                once: true
            }
        );


    </script>

</body>
</html>
